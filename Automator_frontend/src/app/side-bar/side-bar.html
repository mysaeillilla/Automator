<nav class="sidebar" [class.sidebar--collapsed]="collapsed()" aria-label="Main navigation">
  <button
    class="nav-item nav-item--toggle"
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="!collapsed()"
    (click)="toggle()"
  >
    <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <path d="M3 5h14M3 10h14M3 15h14" />
    </svg>
  </button>

  <ul class="sidebar__list">
    @for (item of mainItems; track item.id) {
      <li>
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          ariaCurrentWhenActive="page"
          [attr.title]="collapsed() ? item.label : null"
        >
          @switch (item.id) {
            @case ('create') {
              <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                   stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M10 3v14M3 10h14" />
              </svg>
            }
            @case ('my-flows') {
              <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                   stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="4.5" cy="14.5" r="2" />
                <circle cx="15.5" cy="5.5" r="2" />
                <path d="M6.2 13.2 13.8 6.8" />
              </svg>
            }
            @case ('packages') {
              <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                   stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 2 17 5.5v9L10 18l-7-3.5v-9L10 2Z" />
                <path d="M3 5.5 10 9l7-3.5M10 9v9" />
              </svg>
            }
            @case ('history') {
              <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                   stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="10" cy="10" r="7.5" />
                <path d="M10 5.5V10l3 2" />
              </svg>
            }
          }
          <span class="nav-item__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="sidebar__footer">
    <a
      class="nav-item"
      [routerLink]="settingsItem.route"
      routerLinkActive="nav-item--active"
      ariaCurrentWhenActive="page"
      [attr.title]="collapsed() ? settingsItem.label : null"
    >
      <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="10" cy="10" r="2.5" />
        <path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8" />
      </svg>
      <span class="nav-item__label">{{ settingsItem.label }}</span>
    </a>
  </div>
</nav>
