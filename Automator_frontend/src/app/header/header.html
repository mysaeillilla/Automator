<header class="header">
  <!-- Left: app launcher + title -->
  <div class="header__left">
    <button class="icon-btn" type="button" aria-label="App launcher">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <circle cx="3" cy="3" r="1.6" /><circle cx="10" cy="3" r="1.6" /><circle cx="17" cy="3" r="1.6" />
        <circle cx="3" cy="10" r="1.6" /><circle cx="10" cy="10" r="1.6" /><circle cx="17" cy="10" r="1.6" />
        <circle cx="3" cy="17" r="1.6" /><circle cx="10" cy="17" r="1.6" /><circle cx="17" cy="17" r="1.6" />
      </svg>
    </button>
    <span class="header__title">{{ appName }}</span>
  </div>

  <!-- Center: search -->
  <div class="header__center">
    <label class="search">
      <svg class="search__icon" width="18" height="18" viewBox="0 0 20 20" fill="none"
           stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="8" r="5.5" />
        <line x1="8" y1="12" x2="2.5" y2="17.5" stroke-linecap="round" />
      </svg>
      <input
        class="search__input"
        type="search"
        placeholder="Search for helpful resources"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>
  </div>

  <!-- Right: environment + actions -->
  <div class="header__right">
    <button class="env" type="button">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor"
           stroke-width="1.3" aria-hidden="true">
        <rect x="3" y="3" width="14" height="14" rx="1" />
        <path d="M6 17V9h8v8M8 6h1M11 6h1M8 12h1M11 12h1" />
      </svg>
      <span class="env__text">
        <span class="env__label">{{ environmentLabel }}</span>
        <span class="env__name">{{ environmentName() }}</span>
      </span>
    </button>

    <button class="icon-btn" type="button" aria-label="Feedback">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
           stroke-width="1.4" aria-hidden="true">
        <circle cx="10" cy="10" r="8" />
        <circle cx="7" cy="8" r="0.8" fill="currentColor" />
        <circle cx="13" cy="8" r="0.8" fill="currentColor" />
        <path d="M6.5 12c1 1.6 2.100 2.200 3.500 2.200s2.500-.6 3.500-2.200" stroke-linecap="round" />
      </svg>
    </button>

    <button class="icon-btn" type="button" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z" />
      </svg>
    </button>
  </div>
</header>
